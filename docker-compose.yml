# Production-oriented stack for Coolify (and `docker compose up` without overrides).
# Local development with bind mounts and published ports:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Coolify: assign the public domain to the `frontend` service on port 5173
# (e.g. https://your-app.example.com:5173 in the service domain field).
# Do not define custom `networks:` — Coolify manages routing on its own bridge.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luxlait_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-luxlait_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  email_service:
    build:
      context: ./email_service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      EMAIL_SERVICE_PORT: ${EMAIL_SERVICE_PORT:-3001}
      # Placeholders allow boot without SendGrid; OTP email will fail until real keys are set.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.disabled}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@localhost}
      EMAIL_SERVICE_SECRET: ${EMAIL_SERVICE_SECRET:?}
    expose:
      - "3001"
    restart: unless-stopped

  solver_service:
    build:
      context: ./solver_service
      dockerfile: Dockerfile
    environment:
      SOLVER_SERVICE_SECRET: ${SOLVER_SERVICE_SECRET:?}
    expose:
      - "8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Do not add bind mounts here (Coolify Storage → /app). They replace the image and
    # remove prisma/schema.prisma. Use docker-compose.dev.yml for local bind mounts only.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?}
      ADMIN_SECRET: ${ADMIN_SECRET:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-http://email_service:3001}
      EMAIL_SERVICE_SECRET: ${EMAIL_SERVICE_SECRET:?}
      SOLVER_SERVICE_URL: ${SOLVER_SERVICE_URL:-http://solver_service:8000}
      SOLVER_SERVICE_SECRET: ${SOLVER_SERVICE_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      BOOTSTRAP_ON_BOOT: ${BOOTSTRAP_ON_BOOT:-true}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:3000/api || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      email_service:
        condition: service_started
      solver_service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Must be the Docker service name, not localhost or the public URL.
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:3000}
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
