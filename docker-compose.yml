networks:
  internal_net:
    driver: bridge
    # DEVELOPMENT: internal set to false to allow Prisma CLI access from host
    # PRODUCTION: Change to 'internal: true' for maximum security
    internal: false

services:
  postgres:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luxlait_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal only: reachable by other services on internal_net, never on the host.
    # Uncomment the ports block below if you need Prisma CLI from your host machine.
    # ports:
    #   - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-luxlait_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      ADMIN_SECRET: ${ADMIN_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-http://email_service:3001}
      EMAIL_SERVICE_SECRET: ${EMAIL_SERVICE_SECRET}
      SOLVER_SERVICE_URL: ${SOLVER_SERVICE_URL:-http://solver_service:8000}
      SOLVER_SERVICE_SECRET: ${SOLVER_SERVICE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      BOOTSTRAP_ON_BOOT: ${BOOTSTRAP_ON_BOOT:-true}
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Backend is reached by the frontend via Vite's /api proxy on the internal
    # Docker network (http://backend:3000). No public host port is required.
    # Uncomment to expose for local Prisma Studio / direct API access on the host:
    # ports:
    #   - "127.0.0.1:3000:3000"
    #   - "127.0.0.1:5555:5555"
    expose:
      - "3000"
      - "5555"
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      email_service:
        condition: service_started
      solver_service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:3000}
      # Coolify magic variable: declaring it here tells Coolify to route the
      # generated FQDN to this service on port 5173. Coolify substitutes
      # SERVICE_FQDN_FRONTEND_5173 at deploy time.
      SERVICE_FQDN_FRONTEND_5173: ${SERVICE_FQDN_FRONTEND_5173:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    # On a plain `docker compose up` (outside Coolify) you can publish the
    # dev server on the host by uncommenting:
    # ports:
    #   - "5173:5173"
    networks:
      - internal_net
    restart: unless-stopped

  email_service:
    build:
      context: ./email_service
      dockerfile: Dockerfile
    container_name: email_service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      EMAIL_SERVICE_PORT: ${EMAIL_SERVICE_PORT:-3001}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      EMAIL_SERVICE_SECRET: ${EMAIL_SERVICE_SECRET}
    volumes:
      - ./email_service:/app
      - /app/node_modules
    networks:
      - internal_net
    restart: unless-stopped

  solver_service:
    build:
      context: ./solver_service
      dockerfile: Dockerfile
    container_name: solver_service
    environment:
      SOLVER_SERVICE_SECRET: ${SOLVER_SERVICE_SECRET}
    networks:
      - internal_net
    restart: unless-stopped

volumes:
  postgres_data:
